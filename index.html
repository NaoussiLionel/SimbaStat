/* Layout: white masthead with a woven-cloth band, light green-tinted canvas, tables first */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);margin:0}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
*{scrollbar-color:var(--brand2) var(--chip);scrollbar-width:thin}*::-webkit-scrollbar{width:10px;height:10px}*::-webkit-scrollbar-track{background:var(--chip);border-radius:99px}*::-webkit-scrollbar-thumb{background:var(--brand2);border:2px solid var(--chip);border-radius:99px}*::-webkit-scrollbar-thumb:hover{background:var(--brand)}
input[type="checkbox"]{appearance:none;width:22px;height:22px;flex:0 0 22px;margin:0;border:1.5px solid var(--muted);border-radius:6px;background:var(--surface);cursor:pointer;display:grid;place-content:center}input[type="checkbox"]:checked{background:var(--brand);border-color:var(--brand)}input[type="checkbox"]:checked:after{content:"";width:10px;height:6px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}
input,select,textarea{accent-color:var(--brand);font-family:var(--body)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
header{background:var(--surface);color:var(--fg);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 4px}
.top-actions{display:flex;align-items:center;gap:8px}.language{display:grid;place-items:center;flex:0 0 42px;width:42px;min-width:42px;max-width:42px;height:42px;min-height:42px;padding:0;aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:700 12px var(--body);cursor:pointer}.account-link{font:700 13px var(--body);padding:8px 12px;border-radius:8px;background:var(--brand);color:#fff}
.account-shell{display:grid;grid-template-columns:1fr 1fr;max-width:900px;margin:0 auto 24px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);box-shadow:0 18px 45px #10261a12}.account-story{position:relative;overflow:hidden;padding:clamp(24px,5vw,52px);background:var(--brand);color:#fff;min-height:390px;display:flex;flex-direction:column;justify-content:space-between}.account-story:after{content:"";position:absolute;width:340px;height:340px;right:-120px;bottom:-130px;border:1px solid #ffffff38;border-radius:50%;box-shadow:0 0 0 28px #ffffff0c,0 0 0 60px #ffffff0c,0 0 0 95px #ffffff0c}.account-story>*{position:relative;z-index:1}.account-story .kicker{color:#9ff5bf}.account-story h1{font-size:clamp(36px,5vw,58px);margin:24px 0 12px}.account-story p{max-width:340px;color:#e0f4e7}.account-story .brand-note{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#c5e9d1}.auth-panel{padding:clamp(22px,4vw,40px);align-self:center}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:var(--bg);border-radius:10px;margin:0 0 24px}.auth-tabs button{border:0;border-radius:8px;background:transparent;padding:10px;color:var(--muted);font:700 14px var(--body);cursor:pointer}.auth-tabs button[aria-pressed="true"]{background:var(--surface);color:var(--brand);box-shadow:0 1px 5px #10261a18}.auth-panel h2{margin-bottom:7px}.auth-panel>p{color:var(--muted);margin:0 0 18px}.auth-form label{display:grid;gap:6px;margin:14px 0;font-weight:600}.auth-form input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:15px var(--body)}.auth-form .btn{width:100%;justify-content:center;margin-top:10px;cursor:pointer}.auth-message{min-height:22px;color:var(--brand);font-size:13px}.anon-note{text-align:center;margin:14px 0 0!important;font-size:12px}.account-settings{max-width:900px;margin:0 auto}.account-settings select[multiple]{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:14px var(--body)}
.logo{display:flex;align-items:center;gap:10px}
.mark{width:42px;height:42px;background:var(--lion-g) center/contain no-repeat;flex:none}
.logo b{display:block;font:800 26px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.logo small{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.pill{font:600 13px var(--body);background:var(--chip);border:1px solid var(--line);color:var(--fg);border-radius:99px;padding:6px 12px;cursor:pointer}
.pill.live{display:inline-flex;gap:6px;align-items:center}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav a{font:700 16px var(--display);letter-spacing:.07em;text-transform:uppercase;padding:11px 14px;border-bottom:3px solid transparent;opacity:.75;white-space:nowrap}
nav a[aria-current="page"]{opacity:1;border-bottom-color:var(--accent)}
.band{height:12px;background:var(--zig) repeat-x center;background-color:var(--surface)}
main{padding-block:22px 40px;min-height:70vh}
h1{font:800 clamp(30px,6vw,48px)/1 var(--display);text-transform:uppercase;margin:0 0 6px}
h2{font:800 24px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0}
.sub{color:var(--muted);margin:0 0 16px}
.sec{margin-top:34px}
.sec-h h2{display:flex;align-items:center;gap:10px}
.sec-h h2::before{content:"";width:12px;height:12px;background:var(--accent);transform:rotate(45deg);flex:none}
.card.pat,.tile{background-image:none}
main::before{content:"";display:block;height:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.more{font:700 13px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--brand2);border-bottom:2px solid var(--accent)}
button.more{background:none;border:0;border-bottom:2px solid var(--accent);padding:0;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.scroll{overflow-x:auto}
/* crest */
.crest{--z:28px;width:var(--z);height:var(--z);border-radius:0;display:inline-grid;place-items:center;flex:none;color:#fff;font:800 calc(var(--z)*.4)/1 var(--display);letter-spacing:.02em;border:2px solid rgba(255,255,255,.6);box-shadow:0 0 0 1px var(--line)}
img.crest{display:inline-block;object-fit:contain;background:transparent;padding:0;border:0;box-shadow:none;color:transparent}
.team{display:inline-flex;align-items:center;gap:10px;font-weight:600;min-width:0}
/* hero */
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.lead{background:linear-gradient(135deg,var(--brand) 0%,var(--brand2) 100%);color:#fff;border-radius:12px;padding:28px;position:relative;overflow:hidden;min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}
.lead::before{content:"";position:absolute;inset:0;background:var(--pat-w);background-size:48px 48px;-webkit-mask:linear-gradient(100deg,transparent 30%,#0b432e 100%);mask:linear-gradient(100deg,transparent 30%,#0b432e 100%)}
.lead::after{content:"";position:absolute;right:-18px;bottom:-24px;width:230px;height:230px;background:var(--lion-w) center/contain no-repeat;opacity:.16}
.lead>*{position:relative;z-index:1}
.kicker{font:700 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.lead h1{font-size:clamp(30px,5vw,46px);max-width:15ch;text-wrap:balance}
.lead p{margin:0;max-width:44ch;opacity:.9}
.btn{display:inline-block;align-self:flex-start;background:var(--accent);color:var(--on-accent);font:800 15px var(--display);letter-spacing:.08em;text-transform:uppercase;padding:9px 16px;border-radius:6px}
.stories{display:grid;gap:10px}
.story{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:4px}
.story .kicker{color:var(--red)}
.story h3{margin:0;font:800 20px/1.1 var(--display);text-transform:uppercase}
.story p{margin:0;color:var(--muted);font-size:14px}
/* strip */
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.col{flex:0 0 250px;scroll-snap-align:start;display:grid;gap:8px;align-content:start}
.dl{font:800 15px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* match card */
.mc{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:0;padding:10px 12px}
.mc .t{display:grid;grid-template-rows:34px auto;justify-items:center;align-content:start;gap:4px;font:700 13px var(--display);letter-spacing:.04em;text-align:center;min-width:0}
.mc .t .crest{width:34px;height:34px}
.mc .t .nm{display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 12px/1.2 var(--display);letter-spacing:.06em}
.team .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font:800 22px var(--display);background:var(--chip);border-radius:0;padding:3px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sc.ns{font-size:13px;letter-spacing:.06em;color:var(--muted)}
.st{grid-column:1/-1;text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
/* tables */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font:700 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 8px;border-bottom:2px solid var(--line);white-space:nowrap;text-align:center}
td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--line)}
tbody tr:nth-child(even) td{background:var(--alt)}
.l{text-align:left}
td.pts{font:800 19px var(--display)}
.pos{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:4px;font-weight:700}
.z1 .pos{background:var(--accent);color:var(--on-accent)}
.zr .pos{background:var(--red);color:#fff}
.gp{color:var(--pos)}.gn{color:var(--red)}
.form{display:inline-flex;gap:3px}
.form i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:800 11px var(--display);font-style:normal;color:#fff}
.form .empty{background:var(--line);color:transparent;padding:0;text-align:center}
.form .W{background:#0a8a4a}.form .D{background:#8b8195}.form .L{background:var(--red)}
.legend{display:flex;flex-wrap:wrap;gap:16px;padding:12px 2px;color:var(--muted);font-size:13px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
tr.link{cursor:pointer}
/* filters */
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{font:700 15px var(--display);letter-spacing:.07em;text-transform:uppercase;padding:8px 16px;border-radius:99px;background:var(--chip);color:var(--fg);border:0;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--brand);color:#fff}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:end}
.filters label{display:grid;gap:3px;font:700 11px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
select{font:600 14px var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:150px}
.mw{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mw button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:700 18px var(--body);cursor:pointer}
.mw button:disabled{opacity:.35;cursor:default}.mw .dd{flex:0 1 180px;min-width:150px}.mw .dd .dd-btn{width:100%;height:auto;min-height:42px;border-radius:4px}
.mrow{display:grid;grid-template-columns:1fr 92px 1fr;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .h{display:flex;justify-content:flex-end}
.mrow .h .team{flex-direction:row-reverse;text-align:right}
.mrow .sc{text-align:center}
.mrow .meta{grid-column:1/-1;text-align:center;font-size:12.5px;color:var(--muted)}
.hres .mrow{grid-template-columns:1fr 72px 1fr}
.hres .mrow .sc{font-size:20px;padding:3px 6px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:10px 2px}
/* leaders */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.lb h3{margin:0;padding:14px 16px 8px;font:800 18px var(--display);letter-spacing:.06em;text-transform:uppercase}
.lb .r{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--line)}
.lb .r:first-of-type{border-top:0}
.lb .r b{font:800 22px var(--display)}
.lb .r:first-of-type b{font-size:34px}
.lb .r>span:nth-child(2){font-weight:400}
.lb .rk{font:800 16px var(--display);color:var(--muted)}
.lb small{display:block;color:var(--muted);font-size:12.5px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tile .k{font:700 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:800 40px/1.05 var(--display)}
.tile .n{font-size:13px;color:var(--muted)}
.cmp{display:grid;grid-template-columns:1fr 110px 1fr;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.cmp .lab{text-align:center;font:700 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cmp .a,.cmp .b{display:flex;align-items:center;gap:8px;font:800 20px var(--display)}
.cmp .a{justify-content:flex-end}
.cmp .bar{height:8px;border-radius:4px;background:var(--brand)}
/* club page */
.chead{background-image:var(--pat-w),linear-gradient(135deg,var(--brand),var(--brand2));background-size:48px 48px,auto;display:flex;gap:18px;align-items:center;color:#fff;border-radius:12px;padding:22px;margin-bottom:16px;flex-wrap:wrap}
.chead h1{margin:0}
.chead .meta{opacity:.85}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-bottom:16px}
